name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - name: Compile (Python 3.12 rejects invalid escapes and syntax errors)
        run: python -W error::SyntaxWarning -m compileall -q helpers media misc notifications traktarr.py
      - run: pytest -q tests

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.mediabox -t traktarr:ci .
      - name: Smoke test
        run: docker run --rm -e TRAKTARR_COLOR=0 traktarr:ci --help | grep -q "movies"
