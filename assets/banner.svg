<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="traktarr: new movies and shows from Trakt, straight into Radarr and Sonarr">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0b1a"/>
      <stop offset="1" stop-color="#05070f"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2bd6"/>
      <stop offset="0.35" stop-color="#9b5cff"/>
      <stop offset="0.7" stop-color="#3fa0ff"/>
      <stop offset="1" stop-color="#22f5c8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#9b5cff" stroke-opacity="0.07"/>
    </pattern>
  </defs>
  <rect width="1280" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="24" fill="url(#grid)"/>
  <rect x="1.5" y="1.5" width="1277" height="317" rx="23" fill="none" stroke="url(#neon)" stroke-opacity="0.55" stroke-width="3"/>

  <!-- film strip -> arrow -> stacked library, in the neon colours -->
  <g transform="translate(96 108)" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="76" height="104" rx="10" stroke="#ff2bd6"/>
    <path d="M14 16v0M14 40v0M14 64v0M14 88v0M62 16v0M62 40v0M62 64v0M62 88v0" stroke="#ff2bd6" stroke-width="8"/>
    <path d="M100 52h46m-14-14 14 14-14 14" stroke="#9b5cff"/>
    <rect x="170" y="10" width="64" height="84" rx="8" stroke="#3fa0ff"/>
    <rect x="186" y="0" width="64" height="84" rx="8" stroke="#22d3ee" stroke-opacity="0.6"/>
  </g>

  <text x="392" y="172" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="112" font-weight="800"
        letter-spacing="6" fill="url(#neon)" filter="url(#glow)">TRAKTARR</text>
  <text x="396" y="228" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" fill="#c9c6e8">
    New movies &amp; shows from Trakt, straight into Radarr &amp; Sonarr
  </text>
  <text x="396" y="268" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="18" fill="#8a87a8">
    anticipated · popular · box office  —  filtered by genre, date, buzz &amp; reviews
  </text>
</svg>
